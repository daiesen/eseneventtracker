name: Weekly Goodmoves Tracker

on:
  schedule:
    - cron: '0 16 * * 5'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
    - name: Access Code Repository
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Scraping Tools
      run: |
        pip install requests beautifulsoup4

    - name: Run Scraper Script
      run: |
        echo "=== DEBUGGING: SHOWING CURRENT SCRAPER.PY CONTENTS ==="
        cat scraper.py
        echo "=== END OF DEBUGGING ==="
        python scraper.py

        - name: Commit and Push Results File
      run: |
        git config --global user.name "Goodmoves Scraper Bot"
        git config --global user.email "bot@goodmoves.org"
        git add active_jobs_social.txt active_jobs_website.txt
        git diff-index --quiet HEAD || git commit -m "Automated active job results sync [skip ci]"
        git push || echo "No changes to push"

    - name: Upload Social Summary Asset
      uses: actions/upload-artifact@v4
      with:
        name: Social_Media_Formatted_Boxes
        path: active_jobs_social.txt

    - name: Upload Website Summary Asset
      uses: actions/upload-artifact@v4
      with:
        name: Website_Formatted_Layouts
        path: active_jobs_website.txt

