name: Weekly Charity Events Tracker

on:
  schedule:
    - cron: '30 9 * * 3' # Wakes up every Wednesday at 9:30 AM UTC (10:30 AM BST)
  workflow_dispatch: # Puts a manual "Run now" button inside your GitHub control panel

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
    - name: Access Code Repository
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Scraping Tools
      run: |
        pip install requests beautifulsoup4

    - name: Process Websites and Extract Events
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python scraper.py

    - name: Update History Log Changes
      run: |
        git config --global user.name "Automated Event Bot"
        git config --global user.email "bot@charity-events.internal"
        git add history.json
        git commit -m "Update tracking snapshots [skip ci]" || echo "No site changes observed"
        git push

    - name: Deliver Weekly Summary Email
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "Weekly Scraped Events Summary"
        to: ${{ secrets.RECIPIENT_EMAIL }}
        from: "Automated Charity Tracker"
        body: file://weekly_summary.md
